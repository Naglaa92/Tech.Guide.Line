<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Guideline</title>
<style>
:root{--red:#c8102e;--red-dark:#9b0c23;--bg:#f6f6f7;--card:#fff;--text:#222;--muted:#666}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{position:relative;overflow:hidden;min-height:130px;background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:flex-end}
.bannerimg{position:absolute;inset-block:0;inset-inline-start:0;height:100%;width:62%;object-fit:cover;object-position:left center;
 -webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
[dir=rtl] .bannerimg{-webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
.info{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
[dir=rtl] .info{align-items:flex-start}
header h1{margin:0;font-size:1.6rem;text-shadow:0 1px 3px rgba(0,0,0,.35)}
@media(max-width:700px){header{flex-direction:column;padding:0 0 12px}
 .bannerimg{position:static;width:100%;height:95px;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
 [dir=rtl] .bannerimg{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
 .info{align-items:center!important}}
.langs button{background:transparent;color:#fff;border:1px solid #fff;padding:6px 12px;margin:0 2px;border-radius:6px;cursor:pointer;font-size:.9rem}
.langs button.active{background:#fff;color:var(--red);font-weight:700}
nav{background:var(--red-dark);display:flex;flex-wrap:wrap}
nav button{flex:1;min-width:120px;background:none;border:0;color:#fff;padding:14px;font-size:1rem;cursor:pointer;border-bottom:4px solid transparent}
nav button.active{border-bottom-color:#fff;font-weight:700;background:rgba(255,255,255,.1)}
main{max-width:900px;margin:0 auto;padding:20px}
section{display:none}section.active{display:block}
.card{background:var(--card);border-radius:10px;padding:18px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card h3{margin-top:0;color:var(--red)}
.video{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden;margin-bottom:12px}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.empty{display:flex;align-items:center;justify-content:center;padding:0;height:200px;color:#bbb}
ol{padding-inline-start:22px}
input[type=search]{width:100%;padding:12px;font-size:1rem;border:2px solid var(--red);border-radius:8px;margin-bottom:16px}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:10px;margin-inline-end:6px}
.result{cursor:pointer}
footer{background:var(--red);color:#fff;text-align:center;padding:22px 10px;margin-top:30px}
.logo{font-size:1.2rem;font-weight:700;letter-spacing:.5px;font-style:italic}
.logo::before{content:"★ "}
</style>
</head>
<body>

<header>
  <img class="bannerimg" src="images/aramex-banner.png" alt="Aramex - delivery unlimited" onerror="this.style.display='none'">
  <div class="info">
    <h1 id="siteTitle"></h1>
    <div class="langs">
      <button data-lang="en">English</button>
      <button data-lang="ar">العربية</button>
      <button data-lang="ur">Roman Urdu</button>
    </div>
  </div>
</header>
<nav>
  <button data-tab="infor"></button>
  <button data-tab="softeon"></button>
  <button data-tab="search"></button>
</nav>

<main>
  <section id="infor"></section>
  <section id="softeon"></section>
  <section id="search">
    <input type="search" id="q">
    <div id="results"></div>
  </section>
</main>

<footer><div class="logo">We make your day to day experience more easy</div></footer>

<script>
/* =====================================================
   1) EDIT HERE: INTERFACE TEXT (3 languages)
   ===================================================== */
const UI = {
  en:{title:"Tech Guideline", infor:"Infor", softeon:"Softeon", search:"Search",
      placeholder:"Search guides...", none:"No results found.", soon:"Video coming soon", steps:"Steps"},
  ar:{title:"دليل الاستخدام", infor:"Infor", softeon:"Softeon", search:"ابحث عن ....",
      placeholder:"ابحث عن ....", none:"لا توجد نتائج.", soon:"الفيديو قريباً", steps:"الخطوات"},
  ur:{title:"Tech Guideline", infor:"Infor", softeon:"Softeon", search:"Talash",
      placeholder:"Guides talash karein...", none:"Koi nateeja nahi mila.", soon:"Video jald aa rahi hai", steps:"Steps"}
};

/* =====================================================
   2) EDIT HERE: GUIDES & VIDEOS
   To add a new guide: copy one { ... } block and paste it
   after a comma. Put your video link in "video".
   - YouTube: use the EMBED link  https://www.youtube.com/embed/VIDEO_ID
   - Own file: put the .mp4 in the "videos" folder and use "videos/name.mp4"
   - Leave "" if there is no video yet.
   ===================================================== */
const GUIDES = {
  infor: [
    {
      video: "",
      title: {en:"How to log in to Infor", ar:"كيفية تسجيل الدخول إلى Infor", ur:"Infor mein login kaise karein"},
      steps: {
        en:["Open the Infor link.","Type your username and password.","Click Sign In."],
        ar:["افتح رابط Infor.","اكتب اسم المستخدم وكلمة المرور.","اضغط تسجيل الدخول."],
        ur:["Infor ka link kholein.","Apna username aur password likhein.","Sign In par click karein."]
      }
    }
  ],
  softeon: [
    {
      video: "",
      title: {en:"How to create an order in Softeon", ar:"كيفية إنشاء طلب في Softeon", ur:"Softeon mein order kaise banayein"},
      steps: {
        en:["Open the Orders menu.","Click New Order.","Fill in the details and Save."],
        ar:["افتح قائمة الطلبات.","اضغط طلب جديد.","املأ البيانات ثم احفظ."],
        ur:["Orders menu kholein.","New Order par click karein.","Tafseelat bharein aur Save karein."]
      }
    }
  ]
};

/* =====================================================
   3) CODE (no need to edit below)
   ===================================================== */
let lang = localStorage.getItem("lang") || "en";
let tab = "infor";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function videoHTML(url){
  if(!url) return `<div class="video empty">▶ ${UI[lang].soon}</div>`;
  if(/youtube\.com|youtu\.be|vimeo\.com/.test(url))
    return `<div class="video"><iframe src="${url}" allowfullscreen loading="lazy"></iframe></div>`;
  return `<div class="video"><video controls preload="metadata" src="${url}"></video></div>`;
}
function cardHTML(g, label){
  return `<div class="card">
    ${label?`<span class="tag">${label}</span>`:""}
    <h3>${g.title[lang]}</h3>${videoHTML(g.video)}
    <strong>${UI[lang].steps}:</strong>
    <ol>${g.steps[lang].map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
}
function render(){
  document.documentElement.lang = lang === "ur" ? "ur-Latn" : lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = UI[lang].title;
  $("#siteTitle").textContent = UI[lang].title;
  $$("nav button").forEach(b=>{b.textContent=UI[lang][b.dataset.tab];b.classList.toggle("active",b.dataset.tab===tab)});
  $$(".langs button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  $$("section").forEach(s=>s.classList.toggle("active",s.id===tab));
  ["infor","softeon"].forEach(k=>$("#"+k).innerHTML = GUIDES[k].map(g=>cardHTML(g)).join(""));
  $("#q").placeholder = UI[lang].placeholder;
  doSearch();
}
function doSearch(){
  const q = $("#q").value.trim().toLowerCase();
  if(!q){ $("#results").innerHTML=""; return; }
  let html = "";
  for(const k of ["infor","softeon"]){
    GUIDES[k].forEach(g=>{
      const hay = (g.title[lang]+" "+g.steps[lang].join(" ")).toLowerCase();
      if(hay.includes(q)) html += `<div class="result" onclick="go('${k}')">${cardHTML(g, UI[lang][k])}</div>`;
    });
  }
  $("#results").innerHTML = html || `<p>${UI[lang].none}</p>`;
}
function go(t){ tab = t; render(); window.scrollTo(0,0); }

$$(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("lang",lang);render()});
$$("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#q").addEventListener("input", doSearch);
render();
</script>
</body>
</html>
