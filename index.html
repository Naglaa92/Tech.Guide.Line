<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Guideline</title>
<style>
:root{--red:#c8102e;--red-dark:#9b0c23;--bg:#f6f6f7;--card:#fff;--text:#222;--muted:#666}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--red);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.logobox{background:#fff;border-radius:10px;padding:10px 18px;display:flex;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.logobox img{height:48px;width:auto;display:block}
.info{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
[dir=rtl] .info{align-items:flex-start}
header h1{margin:0;font-size:1.6rem}
@media(max-width:700px){header{justify-content:center;text-align:center}.info{align-items:center!important}}
.langs button{background:transparent;color:#fff;border:1px solid #fff;padding:6px 12px;margin:0 2px;border-radius:6px;cursor:pointer;font-size:.9rem}
.langs button.active{background:#fff;color:var(--red);font-weight:700}
.layout{display:flex;gap:20px;max-width:1200px;margin:0 auto;padding:20px;align-items:flex-start}
aside{width:270px;flex:none;background:var(--card);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.15);overflow:hidden;position:sticky;top:10px}
aside button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;border:0;cursor:pointer;font:inherit}
.sec-btn{background:var(--red);color:#fff;padding:13px 14px;font-size:1.05rem;font-weight:700;border-bottom:1px solid var(--red-dark)}
.sec-btn.active{background:var(--red-dark)}
.arrow{transition:transform .2s}.open>.sec-btn .arrow,.open>.proc-btn .arrow{transform:rotate(90deg)}
[dir=rtl] .arrow{transform:scaleX(-1)}[dir=rtl] .open>.sec-btn .arrow,[dir=rtl] .open>.proc-btn .arrow{transform:scaleX(-1) rotate(90deg)}
.sub .proc-btn{background:#f3dde0;color:var(--red-dark);font-weight:700;padding-inline-start:20px}
.sub .proc-btn.active{background:#e8bfc5}
.sub .sub{background:#fff}.sub .sub button{padding-inline-start:36px}
.sub{display:none;background:#fafafa}.open>.sub{display:block}
.sub button{background:none;padding:10px 14px;padding-inline-start:26px;border-bottom:1px solid #eee;font-size:.93rem;color:var(--text)}
.sub button:hover{background:#fdecee}
.sub button.active{background:#fdecee;color:var(--red);font-weight:700;border-inline-start:4px solid var(--red)}
main{flex:1;min-width:0;width:100%}
.arrow{font-size:.75em}
.empty-note{padding:10px 14px;color:var(--muted);font-size:.9rem}
@media(max-width:800px){.layout{flex-direction:column;padding:12px}aside{width:100%;position:static}}
section{display:none}section.active{display:block}
.card{background:var(--card);border-radius:10px;padding:18px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card h3{margin-top:0;color:var(--red)}
.video{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden;margin-bottom:12px}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.empty{display:flex;align-items:center;justify-content:center;padding:0;height:200px;color:#bbb}
ol{padding-inline-start:22px}
input[type=search]{width:100%;padding:12px;font-size:1rem;border:2px solid var(--red);border-radius:8px;margin-bottom:16px}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:10px;margin-inline-end:6px}
.result{cursor:pointer}
footer{background:var(--red);color:#fff;text-align:center;padding:22px 10px;margin-top:30px}
.logo{font-size:1.2rem;font-weight:700;letter-spacing:.5px;font-style:italic}
.logo::before{content:"★ "}
</style>
</head>

const AR_RX = /[-\u2013_ ]\s*AR(?![A-Za-z0-9])/;
function isAR(g){
  let v = g.video || ""; try{ v = decodeURI(v); }catch(e){}

function fixUrl(u){
  let m;
  if((m=u.match(/youtube\.com\/watch\?(?:.*&)?v=([\w-]{11})/))||(m=u.match(/youtu\.be\/([\w-]{11})/))) return "https://www.youtube.com/embed/"+m[1];
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return "https://drive.google.com/file/d/"+m[1]+"/preview";
  if(/canva\.com\/design\//.test(u) && !/embed/.test(u)) return u.split("?")[0].replace(/\/(view|edit|watch)$/,"")+"/view?embed";
  return u;
}
function videoHTML(url){

  return `<div class="video"><video controls playsinline preload="metadata" src="${url}"></video></div>`;

      const items = GUIDES[k].map((g,i)=>({g,i})).filter(o=>pr(o.g)===p && vis(o.g));
      h += `<div class="${open[key]?"open":""}">
        <button class="proc-btn ${tab===k&&idx===null&&proc===p?"active":""}" onclick="toggleProc('${k}','${p}')">
          <span>${UI[lang][LBL[p]]}</span><span class="arrow">▶</span></button>
        <div class="sub">${items.length ? items.map(o=>
          `<button class="${tab===k&&idx===o.i?"active":""}" onclick="openGuide('${k}',${o.i})"><span>▶ ${o.g.title[lang]}</span></button>`).join("")
          : `<div class="empty-note">—</div>`}</div></div>`;
    }
    h += `</div></div>`;
  }
  h += `<button class="sec-btn ${tab==="search"?"active":""}" onclick="openSearch()"><span>🔍 ${UI[lang].search}</span></button>`;
  return h;
}
function render(){
  if(idx!==null && GUIDES[tab] && !vis(GUIDES[tab][idx])) idx = null;
  document.documentElement.lang = lang === "ur" ? "ur-Latn" : lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = UI[lang].title;
  $("#siteTitle").textContent = UI[lang].title;
  $$(".langs button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  $("#side").innerHTML = sideHTML();
  $$("section").forEach(s=>s.classList.toggle("active",s.id===tab));
  ["infor","softeon"].forEach(k=>{
    let list = GUIDES[k].filter(vis);
    if(tab===k){
      if(idx!==null) list = [GUIDES[k][idx]];
      else if(proc) list = list.filter(g=>pr(g)===proc);
    }
    $("#"+k).innerHTML = list.length ? list.map(g=>cardHTML(g)).join("") : `<div class="card">${UI[lang].none}</div>`;
  });
  $("#q").placeholder = UI[lang].placeholder;
  doSearch();
}
function toggleSec(k){ open[k] = !open[k] || tab!==k || idx!==null || proc!==null; tab=k; idx=null; proc=null; render(); }
function toggleProc(k,p){
  const key = k+"_"+p, same = tab===k && idx===null && proc===p;
  open[key] = !open[key] || !same; open[k] = true; tab=k; idx=null; proc=p; render();
}
function openGuide(k,i){ tab=k; idx=i; proc=null; open[k]=true; open[k+"_"+pr(GUIDES[k][i])]=true; render(); $("main").scrollIntoView({behavior:"smooth",block:"start"}); }
function openSearch(){ tab="search"; idx=null; proc=null; render(); $("#q").focus(); }
function doSearch(){
  const q = $("#q").value.trim().toLowerCase();
  if(!q){ $("#results").innerHTML=""; return; }
  let html = "";
  for(const k of ["infor","softeon"]){
    GUIDES[k].forEach((g,i)=>{
      if(!vis(g)) return;
      const hay = (g.title[lang]+" "+g.steps[lang].join(" ")).toLowerCase();
      if(hay.includes(q)) html += `<div class="result" onclick="openGuide('${k}',${i})">${cardHTML(g, UI[lang][k]+" › "+UI[lang][LBL[pr(g)]])}</div>`;
    });
  }
  $("#results").innerHTML = html || `<p>${UI[lang].none}</p>`;
}

$$(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{ localStorage.setItem("lang",lang); }catch(e){}render()});
$("#q").addEventListener("input", doSearch);
render();
</script>
</body>
</html>
